name: Publish Teal Dashboard
on:
  push:
    branches: [main]
    paths:
      - index.html
      - terminal.mjs
      - vendor/supabase-js-2.76.1.js
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Gate production deployment on module syntax and content security
        run: |
          node --check terminal.mjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('terminal.mjs').read_text()
          assert 'src="./terminal.mjs"' in html, "Missing local owner terminal module"
          assert "from './vendor/supabase-js-2.76.1.js'" in js
          for name,source in [('index.html',html),('terminal.mjs',js)]:
              assert 'esm.sh' not in source and 'jsdelivr' not in source, f'Remote SDK CDN detected in {name}'
          import hashlib
          bundle=Path('vendor/supabase-js-2.76.1.js').read_bytes()
          header,payload=bundle.split(b'\n',1)
          prefix=b'// SHA-256 (payload excluding this comment): '
          assert header.startswith(prefix) and hashlib.sha256(payload).hexdigest().encode()==header[len(prefix):], 'Vendor hash mismatch'
          assert 'Content-Security-Policy' in html, "Missing security policy"
          assert "script-src 'self'" in html, "Missing allowlisted script policy"
          assert "storage:window.sessionStorage" in js, "Persistent token storage forbidden"
          assert "const SESSION_MS=15*60*1000;" in js, "Session lifetime mismatch"
          assert "teal-terminal" in html and "research/terminal" in js
          assert "api.github.com" not in html and "api.github.com" not in js
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
