name: Teal Frontend JavaScript Smoke
on:
  push:
    branches: [main]
    paths: ['index.html','.github/workflows/teal-frontend-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse dashboard module and assert login wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          match=re.search(r'<script type="module">([\s\S]*?)</script>',html)
          assert match, 'Missing dashboard module'
          js=match.group(1)
          Path('/tmp/teal-login.mjs').write_text(js)
          assert "googleButton.disabled=false" in js
          assert "cdn.jsdelivr.net" in js
          assert "signInWithOAuth" in js
          assert "loadAutonomy" in js
          assert "research/autonomy" in html or "autonomy-workspace" in html
          print("Dashboard module and auth wiring found")
          PY
          node --check /tmp/teal-login.mjs
