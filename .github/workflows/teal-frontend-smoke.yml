name: Teal Frontend JavaScript Smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['index.html','terminal.mjs','.github/workflows/teal-frontend-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Match the currently enforced branch-ruleset required check context exactly.
    name: Teal Frontend JavaScript Smoke / validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reject unpinned GitHub Actions
        run: |
          if grep -rnE 'uses: .*@v[0-9]' .github/; then
            echo 'Unpinned action reference found'; exit 1
          fi
      - name: Parse dashboard module and assert login wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          assert '<script type="module" src="./terminal.mjs"></script>' in html, 'Missing local JS module'
          js=Path('terminal.mjs').read_text()
          Path('/tmp/teal-login.mjs').write_text(js)
          assert 'Content-Security-Policy' in html, 'No browser CSP'
          assert "script-src 'self'" in html, 'Scripts must require an allowlist'
          assert "'unsafe-eval'" not in html, 'No eval permitted'
          assert "storage:window.sessionStorage" in js, 'Avoid long-lived browser token storage'
          assert "const SESSION_MS=15*60*1000;" in js, 'Fixed session expiry required'
          assert "from './vendor/supabase-js-2.76.1.js'" in js, 'Pin auth SDK to local bundle'
          assert '@supabase/supabase-js@2/+' not in js, 'Unpinned fallback SDK'
          assert "googleButton.disabled=false" in js
          assert "esm.sh" not in js and "jsdelivr" not in js
          assert "esm.sh" not in html and "jsdelivr" not in html
          assert "signInWithOAuth" in js
          assert "loadAutonomy" in js
          assert "loadOwnerTerminal" in js
          assert "terminalReset()" in js
          assert "research/terminal" in js
          assert "teal-terminal" in html
          assert "terminal-market-rows" in html
          assert "terminal-predictions" in html
          assert 'terminal-daytrading-heading' in html
          assert 'terminal-daytrade-rows' in html
          assert "data.daytrading" in js
          assert "terminalEmptyRow($('terminal-daytrade-rows')" in js
          assert "terminal-paper-cases" in html
          assert "terminal-tradingview" in html
          assert "sandbox=\"allow-scripts allow-popups\"" in html
          assert "allow-same-origin" not in html.split('id="terminal-tradingview"')[1].split('</iframe>')[0]
          assert "assurance.data?.currentLevel!=='aal2'" in js, 'Owner self-test must require TOTP AAL2'
          assert "sessionExpired(local)" in js, 'Owner self-test must enforce 15-minute local deadline'
          assert "data.trading_enabled===false" in js, 'Security self-test must prove broker isolation'
          assert "loadCurrentQuotes" in js
          assert "loadTradingView" in js
          assert "research/quotes" in js
          assert "Coinbase Exchange public ticker" in js
          assert "api.github.com" not in html, "Private GitHub must not be called from public HTML"
          assert "research/autonomy" in html or "autonomy-workspace" in html
          print("Dashboard module and auth wiring found")
          PY
          node --check /tmp/teal-login.mjs
